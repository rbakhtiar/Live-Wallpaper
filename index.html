<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Emerald Castle — Live Wallpaper</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;500;500;600&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #010806;
    font-family: "Alegreya", serif;
}

/* =========================
   SKY
========================= */

.sky {
    position: fixed;
    inset: 0;

    background:
        radial-gradient(
            ellipse at 50% 48%,
            rgba(15, 92, 66, .25),
            transparent 42%
        ),
        linear-gradient(
            to bottom,
            #010403 0%,
            #03100c 42%,
            #052219 73%,
            #020b08 100%
        );
}

/* =========================
   MOON
========================= */

.moon {
    position: absolute;

    width: 130px;
    height: 130px;

    top: 13%;
    right: 15%;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 32%,
            #f4fff9,
            #c7e6d8 55%,
            #7da594 100%
        );

    box-shadow:
        0 0 35px rgba(180,255,225,.18),
        0 0 110px rgba(0,255,170,.08);

    opacity: .78;
}

/* =========================
   CLOUDS
========================= */

.cloud {
    position: absolute;

    width: 500px;
    height: 90px;

    border-radius: 50%;

    background: rgba(1,12,9,.55);

    filter: blur(25px);

    animation: clouds 42s linear infinite;
}

.cloud.a {
    top: 18%;
    left: -550px;
}

.cloud.b {
    top: 34%;
    left: -700px;

    animation-duration: 58s;
    animation-delay: -25s;
}

@keyframes clouds {
    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(160vw);
    }
}

/* =========================
   STARS
========================= */

#stars {
    position: absolute;
    inset: 0;
}

.star {
    position: absolute;

    width: 2px;
    height: 2px;

    border-radius: 50%;

    background: #d8fff0;

    box-shadow:
        0 0 7px rgba(160,255,220,.7);

    animation: starPulse 4s ease-in-out infinite;
}

@keyframes starPulse {
    0%,100% {
        opacity: .1;
    }

    50% {
        opacity: .8;
    }
}

/* =========================
   DISTANT MOUNTAIN
========================= */

.mountain {
    position: absolute;

    bottom: 23%;
    left: -10%;

    width: 120%;
    height: 35%;

    background:
        linear-gradient(
            150deg,
            transparent 35%,
            #03130e 36%,
            #03130e 60%,
            transparent 61%
        );

    opacity: .75;
}

/* =========================
   GIANT HILL
========================= */

.hill {
    position: absolute;

    bottom: -25%;
    left: -15%;

    width: 130%;
    height: 60%;

    border-radius: 50% 50% 0 0;

    background:
        radial-gradient(
            ellipse at 50% 10%,
            #0a4933 0%,
            #063323 30%,
            #031b12 62%,
            #010a07 100%
        );

    box-shadow:
        0 -25px 70px rgba(0,255,170,.06);
}

/* =========================
   CASTLE
========================= */

.castle {
    position: absolute;

    width: 760px;
    height: 430px;

    left: 50%;
    bottom: 29%;

    transform: translateX(-50%);

    filter:
        drop-shadow(0 25px 35px rgba(0,0,0,.85))
        drop-shadow(0 0 35px rgba(0,255,170,.05));
}

/* Castle body */

.building {
    position: absolute;

    left: 130px;
    bottom: 0;

    width: 500px;
    height: 190px;

    background:
        linear-gradient(
            90deg,
            #08100d,
            #18231d 45%,
            #0a110e
        );

    clip-path: polygon(
        0 18%,
        8% 18%,
        8% 10%,
        18% 10%,
        18% 18%,
        32% 18%,
        32% 5%,
        45% 5%,
        45% 18%,
        60% 18%,
        60% 9%,
        72% 9%,
        72% 18%,
        86% 18%,
        86% 7%,
        100% 7%,
        100% 100%,
        0 100%
    );

    border: 1px solid rgba(180,220,205,.1);
}

/* =========================
   TOWERS
========================= */

.tower {
    position: absolute;

    bottom: 0;

    width: 82px;

    background:
        linear-gradient(
            90deg,
            #050b08,
            #18231d 50%,
            #060b09
        );

    border: 1px solid rgba(190,225,210,.12);
}

/* Individual tower sizes */

.t1 {
    left: 30px;
    height: 275px;
}

.t2 {
    left: 105px;
    height: 345px;
}

.t3 {
    left: 250px;
    height: 395px;
    width: 95px;
}

.t4 {
    right: 120px;
    height: 315px;
}

.t5 {
    right: 35px;
    height: 255px;
}

.t6 {
    left: 390px;
    height: 285px;
    width: 75px;
}

/* =========================
   SPIRES
========================= */

.spire {
    position: absolute;

    left: 50%;
    top: -105px;

    width: 0;
    height: 0;

    transform: translateX(-50%);

    border-left: 47px solid transparent;
    border-right: 47px solid transparent;
    border-bottom: 110px solid #101c17;

    filter:
        drop-shadow(0 4px 4px rgba(0,0,0,.8));
}

.spire::after {
    content: "";

    position: absolute;

    left: -2px;
    top: 5px;

    width: 4px;
    height: 28px;

    background: #687d72;
}

/* Different spire sizes */

.t2 .spire {
    border-left-width: 43px;
    border-right-width: 43px;
    border-bottom-width: 105px;
}

.t3 .spire {
    top: -145px;

    border-left-width: 54px;
    border-right-width: 54px;
    border-bottom-width: 150px;
}

.t4 .spire {
    top: -120px;

    border-left-width: 46px;
    border-right-width: 46px;
    border-bottom-width: 125px;
}

.t5 .spire {
    top: -95px;

    border-left-width: 43px;
    border-right-width: 43px;
    border-bottom-width: 100px;
}

.t6 .spire {
    top: -110px;

    border-left-width: 40px;
    border-right-width: 40px;
    border-bottom-width: 115px;
}

/* =========================
   BATTLEMENTS
========================= */

.tower::before {
    content: "";

    position: absolute;

    left: -5px;
    right: -5px;
    top: -12px;

    height: 17px;

    background:
        repeating-linear-gradient(
            90deg,
            #111c17 0px,
            #111c17 13px,
            transparent 13px,
            transparent 23px
        );
}

/* =========================
   WINDOWS
========================= */

.window {
    position: absolute;

    width: 12px;
    height: 28px;

    border-radius: 50% 50% 4px 4px;

    background:
        linear-gradient(
            to bottom,
            #b8ffdc,
            #245d43
        );

    box-shadow:
        0 0 12px rgba(80,255,175,.3);

    opacity: .65;
}

.tower .window {
    left: 50%;
    transform: translateX(-50%);
}

.tower .window.w1 {
    top: 70px;
}

.tower .window.w2 {
    top: 125px;
}

.tower .window.w3 {
    top: 180px;
}

.tower .window.w4 {
    top: 235px;
}

/* Castle body windows */

.building .window {
    top: 75px;
}

.building .window.a {
    left: 170px;
}

.building .window.b {
    left: 240px;
}

.building .window.c {
    left: 310px;
}

.building .window.d {
    left: 380px;
}

/* =========================
   MAIN DOOR
========================= */

.door {
    position: absolute;

    bottom: 0;
    left: 48%;

    width: 48px;
    height: 83px;

    border-radius: 28px 28px 0 0;

    background:
        linear-gradient(
            90deg,
            #020605,
            #0b1510,
            #020605
        );

    border: 1px solid rgba(180,220,205,.1);
}

/* =========================
   FLAGS
========================= */

.flagpole {
    position: absolute;

    top: -155px;
    left: 50%;

    width: 2px;
    height: 100px;

    background: #667b70;
}

.flagpole::after {
    content: "";

    position: absolute;

    top: 2px;
    left: 2px;

    width: 40px;
    height: 25px;

    background:
        linear-gradient(
            135deg,
            #064d35,
            #0b2d21
        );

    clip-path: polygon(
        0 0,
        100% 15%,
        78% 50%,
        100% 85%,
        0 100%
    );
}

/* =========================
   MIST
========================= */

.mist {
    position: absolute;

    bottom: 20%;
    left: -10%;

    width: 120%;
    height: 100px;

    background:
        radial-gradient(
            ellipse,
            rgba(125,205,175,.12),
            transparent 70%
        );

    filter: blur(20px);

    animation: mistMove 12s ease-in-out infinite alternate;
}

@keyframes mistMove {

    from {
        transform: translateX(-4%);
    }

    to {
        transform: translateX(4%);
    }

}

/* =========================
   RAIN
========================= */

#rain {
    position: fixed;
    inset: 0;

    pointer-events: none;

    z-index: 50;
}

.drop {
    position: absolute;

    top: -30px;

    width: 1px;

    background:
        linear-gradient(
            transparent,
            rgba(185,255,230,.6)
        );

    transform: rotate(13deg);

    animation:
        fall linear infinite;
}

@keyframes fall {

    to {
        transform:
            translate(-120px,115vh)
            rotate(13deg);
    }

}

/* =========================
   GLASS
========================= */

.glass {
    position: fixed;
    inset: 0;

    pointer-events: none;

    z-index: 80;

    background:
        radial-gradient(
            ellipse at center,
            transparent 35%,
            rgba(0,0,0,.38) 100%
        );

    box-shadow:
        inset 0 0 120px rgba(0,0,0,.45);
}

/* =========================
   TITLE
========================= */

.title {
    position: absolute;

    top: 7%;
    left: 50%;

    transform: translateX(-50%);

    z-index: 90;

    text-align: center;

    color: rgba(226,255,242,.82);

    text-shadow:
        0 0 30px rgba(0,255,170,.1);
}

.title h1 {
    margin: 0;

    font-size: clamp(40px,6vw,76px);

    font-weight: 500;

    letter-spacing: 6px;
}

.title p {
    margin: 3px 0 0;

    font-size: 14px;

    letter-spacing: 8px;

    opacity: .42;
}

/* =========================
   CLOCK
========================= */

.clock {
    position: absolute;

    bottom: 6%;
    left: 50%;

    transform: translateX(-50%);

    z-index: 90;

    font-size: clamp(28px,4vw,50px);

    letter-spacing: 4px;

    color: rgba(225,255,242,.65);
}

</style>
</head>

<body>

<div class="sky"></div>

<div id="stars"></div>

<div class="moon"></div>

<div class="cloud a"></div>
<div class="cloud b"></div>

<div class="mountain"></div>

<!-- CASTLE -->

<div class="castle">

    <div class="building">

        <div class="window a"></div>
        <div class="window b"></div>
        <div class="window c"></div>
        <div class="window d"></div>

        <div class="door"></div>

    </div>

    <div class="tower t1">
        <div class="spire"></div>
        <div class="window w1"></div>
        <div class="window w2"></div>
        <div class="flagpole"></div>
    </div>

    <div class="tower t2">
        <div class="spire"></div>
        <div class="window w1"></div>
        <div class="window w2"></div>
        <div class="window w3"></div>
        <div class="flagpole"></div>
    </div>

    <div class="tower t3">
        <div class="spire"></div>
        <div class="window w1"></div>
        <div class="window w2"></div>
        <div class="window w3"></div>
        <div class="window w4"></div>
        <div class="flagpole"></div>
    </div>

    <div class="tower t4">
        <div class="spire"></div>
        <div class="window w1"></div>
        <div class="window w2"></div>
        <div class="window w3"></div>
        <div class="flagpole"></div>
    </div>

    <div class="tower t5">
        <div class="spire"></div>
        <div class="window w1"></div>
        <div class="window w2"></div>
        <div class="flagpole"></div>
    </div>

    <div class="tower t6">
        <div class="spire"></div>
        <div class="window w1"></div>
        <div class="window w2"></div>
        <div class="window w3"></div>
    </div>

</div>

<div class="hill"></div>

<div class="mist"></div>

<div id="rain"></div>

<div class="title">
    <h1>Emerald</h1>
    <p>ALEGREYA</p>
</div>

<div class="clock" id="clock"></div>

<div class="glass"></div>

<script>

/* =========================
   STARS
========================= */

const stars = document.getElementById("stars");

for (let i = 0; i < 75; i++) {

    const s = document.createElement("div");

    s.className = "star";

    s.style.left =
        Math.random() * 100 + "%";

    s.style.top =
        Math.random() * 55 + "%";

    s.style.animationDelay =
        Math.random() * 4 + "s";

    stars.appendChild(s);
}

/* =========================
   RAIN
========================= */

const rain = document.getElementById("rain");

for (let i = 0; i < 100; i++) {

    const r = document.createElement("div");

    r.className = "drop";

    r.style.left =
        Math.random() * 110 + "%";

    r.style.height =
        (10 + Math.random() * 20) + "px";

    r.style.opacity =
        .15 + Math.random() * .5;

    r.style.animationDuration =
        (.65 + Math.random() * .8) + "s";

    r.style.animationDelay =
        (-Math.random() * 2) + "s";

    rain.appendChild(r);
}

/* =========================
   CLOCK
========================= */

function clock() {

    const now = new Date();

    let h = now.getHours();

    const m =
        String(now.getMinutes()).padStart(2,"0");

    const s =
        String(now.getSeconds()).padStart(2,"0");

    const ampm =
        h >= 12 ? "PM" : "AM";

    h = h % 12 || 12;

    document.getElementById("clock")
        .textContent =
        `${String(h).padStart(2,"0")}:${m}:${s} ${ampm}`;
}

clock();

setInterval(clock,1000);

/* =========================
   DOUBLE CLICK FULLSCREEN
========================= */

document.addEventListener("dblclick", () => {

    if (!document.fullscreenElement) {

        document.documentElement.requestFullscreen();

    } else {

        document.exitFullscreen();

    }

});

</script>

</body>
</html>
